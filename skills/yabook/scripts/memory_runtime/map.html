<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memória YABook</title><style>
:root{font:15px system-ui;color:#dfe7ed;background:#0e1721}*{box-sizing:border-box}body{margin:0}header{padding:24px 28px;border-bottom:1px solid #2b3d50}h1{margin:0;font-size:26px}p{color:#a8bbc9;line-height:1.6}header p{margin-bottom:0}.toolbar{padding:18px 28px;display:flex;gap:12px;flex-wrap:wrap}input,select,button{background:#172636;color:#e4edf4;border:1px solid #38516a;border-radius:8px;padding:10px}input{min-width:230px;flex:1}main{display:grid;grid-template-columns:280px minmax(300px,1fr) 340px;min-height:65vh}aside,section{padding:18px;border:1px solid #223548;min-width:0}h2{font-size:16px}button{cursor:pointer}#tree button{display:block;width:100%;text-align:left;margin:6px 0}svg{width:100%;height:540px}svg text{fill:#e6eef5;font-size:11px;pointer-events:none}svg circle{cursor:pointer;stroke:#8fd4ed;stroke-width:1.5}svg circle:focus{stroke:#fff;stroke-width:4}svg line{stroke:#425d70}.badge{padding:4px 7px;background:#244052;border-radius:5px;display:inline-block;margin:3px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace;line-height:1.6}#detail{overflow-wrap:anywhere}#status{padding:0 28px;color:#a8bbc9}@media(max-width:1000px){main{grid-template-columns:220px 1fr}#detail{grid-column:1/-1}}@media(max-width:600px){main{display:block}svg{height:430px}.toolbar{padding:12px}header{padding:18px}}
</style></head><body>
<header><h1>Memória YABook</h1><p>Conhecimento, fontes e relações. Selecione um item para conferir sua aplicação e evidências.</p></header>
<div class="toolbar"><input id="query" aria-label="Buscar memória" placeholder="Buscar assunto, fonte ou operação…"><select id="scope" aria-label="Escopo"><option value="">Todos os escopos</option></select><select id="origin" aria-label="Origem"><option value="">Todas as origens</option></select><select id="state" aria-label="Situação"><option value="">Todas as situações</option><option value="hypothesis">Hipóteses</option><option value="confirmed">Confirmadas</option></select></div>
<p id="status" role="status"></p><main><aside><h2>Hierarquia</h2><nav id="tree" aria-label="Mapa de conhecimento"></nav></aside><section><h2>Relações</h2><svg id="graph" viewBox="0 0 700 540" role="img" aria-label="Grafo das memórias"></svg><p>Linhas tracejadas indicam sugestões. A posição visual não representa grau de confiança.</p></section><aside id="detail"><h2>Detalhes</h2><p>Escolha uma memória, entidade ou grupo.</p></aside></main>
<script type="application/json" id="data">__YABOOK_DATA__</script><script>
'use strict';let data=JSON.parse(document.getElementById('data').textContent),selected=null;
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
function element(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.appendChild(e);return e}
function populate(){for(const key of ['scope','origin']){const old=$(key).value;while($(key).options.length>1)$(key).remove(1);const values=key==='scope'?[...new Set(data.nodes.filter(n=>n.kind==='scope').map(n=>n.scope.join('/')))]:[...new Set(data.nodes.filter(n=>n.entry).map(n=>n.entry.source))];values.sort().forEach(v=>{const o=element('option',v,$(key));o.value=v});$(key).value=old}}
function visible(){const q=$('query').value.toLocaleLowerCase(),scope=$('scope').value,origin=$('origin').value,state=$('state').value;return data.nodes.filter(n=>(!scope||(n.entry?.scope||n.scope).join('/')===scope||(n.entry?.scope||n.scope).join('/').startsWith(scope+'/'))&&(!origin||n.entry?.source===origin)&&(!state||n.entry?.state===state)&&(!q||JSON.stringify(n).toLocaleLowerCase().includes(q)))}
function detail(n){selected=n.id;$('detail').replaceChildren();element('h2',n.title,$('detail'));const e=n.entry;if(!e){element('p',(n.scope||[]).join(' › '),$('detail'));return}for(const value of [e.collection,e.state||'entidade',e.source==='own'?'Própria':'Externa: '+e.source]){const badge=element('span',value,$('detail'));badge.className='badge'}for(const [label,key]of [['Conhecimento','content'],['Resumo','summary'],['Aplicação','application'],['Condições','conditions'],['Evidências','evidence'],['Última verificação','last_verified'],['Origem','origin'],['Revisão externa','source_revision'],['Atualizações na origem','origin_updates']]){if(e[key]){element('h3',label,$('detail'));element('pre',typeof e[key]==='string'?e[key]:JSON.stringify(e[key],null,2),$('detail'))}}element('p','ID: '+e.id+' · revisão '+e.revision,$('detail'));element('p','Solicite alterações pela skill YABook; esta interface é somente leitura.',$('detail'))}
function render(){const all=visible(),nodes=all.slice(0,150),ids=new Set(nodes.map(n=>n.id));$('tree').replaceChildren();for(const n of nodes){const b=element('button',(n.entry?'• ':'▸ ')+n.title,$('tree'));b.style.paddingLeft=(10+Math.min((n.entry?.scope||n.scope||[]).length,6)*10)+'px';b.onclick=()=>detail(n)}$('graph').replaceChildren();const positions=new Map(nodes.map((n,i)=>[n.id,{x:350+Math.cos(i*2*Math.PI/Math.max(nodes.length,1))*(n.kind==='scope'?130:240),y:270+Math.sin(i*2*Math.PI/Math.max(nodes.length,1))*(n.kind==='scope'?110:220)}]));for(const l of data.links){if(!ids.has(l.source)||!ids.has(l.target))continue;const a=positions.get(l.source),b=positions.get(l.target),line=document.createElementNS(ns,'line');for(const[k,v]of Object.entries({x1:a.x,y1:a.y,x2:b.x,y2:b.y}))line.setAttribute(k,v);if(l.suggested)line.setAttribute('stroke-dasharray','5 5');const title=document.createElementNS(ns,'title');title.textContent=l.type;line.appendChild(title);$('graph').appendChild(line)}for(const n of nodes){const p=positions.get(n.id),g=document.createElementNS(ns,'g'),c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',n.kind==='scope'?10:7);c.setAttribute('fill',n.entry?.external?'#bb8241':n.entry?.state==='hypothesis'?'#75548d':'#247783');c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label',n.title);c.onclick=()=>detail(n);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();detail(n)}};g.appendChild(c);const t=document.createElementNS(ns,'text');t.setAttribute('x',p.x+12);t.setAttribute('y',p.y+4);t.textContent=n.title.length>24?n.title.slice(0,24)+'…':n.title;g.appendChild(t);$('graph').appendChild(g)}$('status').textContent=all.length+' itens · '+(all.length>150?'exibindo os primeiros 150; refine os filtros · ':'')+'base '+data.revision.slice(0,12);if(selected){const n=data.nodes.find(n=>n.id===selected);if(n)detail(n);else{$('detail').replaceChildren();element('p','Este registro foi retirado da visão atual.',$('detail'))}}}
for(const id of ['query','scope','origin','state'])$(id).addEventListener('input',render);populate();render();if(location.protocol!=='file:')setInterval(async()=>{try{const response=await fetch('/api/map',{cache:'no-store'});if(!response.ok)throw Error();data=await response.json();populate();render()}catch{$('status').textContent='Atualização indisponível; mostrando a última leitura.'}},15000);
</script></body></html>
