<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="yabook-token" content="{{TOKEN}}">
<meta name="theme-color" content="#0d1117">
<title>YABook Tasks</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script>
  // Tema antes da primeira pintura: evita piscar ao abrir no escuro.
  try { const t = localStorage.getItem("yabook.tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  try { document.documentElement.dataset.nav = localStorage.getItem("yabook.navegacao") || (matchMedia("(max-width: 1190px)").matches ? "compacta" : "expandida"); } catch (e) {}
</script>
<script src="app.js" defer></script>
</head>
<body>
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
<aside class="navegacao" aria-label="Espaço de trabalho">
  <div class="navegacao-topo">
  <a class="marca" href="#hoje" aria-label="YABook Tasks — Hoje">
    <img src="icon.svg" alt="" width="34" height="34">
    <span class="marca-texto">YABook<span>Tasks</span></span>
  </a>
  <button id="compactar" class="botao-icone discreto" type="button" aria-controls="abas" aria-expanded="true" aria-label="Compactar navegação" title="Compactar navegação"></button>
  </div>
  <span class="nav-legenda">Visões</span>
  <nav id="abas" class="abas" aria-label="Visões"></nav>
  <footer class="navegacao-rodape">
    <div class="dispositivo"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="2.5" width="10" height="8" rx="1"/><path d="M1 13h14M5 10.5 4 13m7-2.5 1 2.5"/></svg><strong id="maquina">…</strong><span id="conexao" class="ponto" title="Conexão"></span></div>
    <span id="resumo" class="projeto-resumo"></span>
    <div class="navegacao-acoes">
      <button id="tema" class="botao-icone discreto" type="button" title="Tema"></button>
      <button id="ajuda" class="botao-icone discreto" type="button" title="Atalhos de teclado (?)" aria-label="Atalhos de teclado"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.3 5.7a1.8 1.8 0 0 1 3.5.6c0 1.4-1.8 1.4-1.8 2.8M8 11v1" stroke-linecap="round"/></svg></button>
      <span id="conexao-texto" class="conexao-texto">Local</span>
    </div>
  </footer>
</aside>
<div class="area-trabalho">
<header class="projeto">
  <div class="projeto-titulo"><span id="visao-icone" class="visao-icone" aria-hidden="true"></span><div><h1 id="visao-titulo">Seu espaço de trabalho</h1></div></div>
  <time id="hoje-data" class="data-atual"></time>
</header>
<div class="barra-filtro">
  <label class="filtro">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="filtro" type="search" aria-label="Filtrar esta visão" placeholder="Buscar nesta visão…" autocomplete="off" aria-keyshortcuts="/">
    <span id="contagem" class="contador"></span>
    <kbd aria-hidden="true">/</kbd>
  </label>
  <div id="opcoes" class="opcoes"></div>
  <div id="edicao" class="edicao"></div>
</div>
<main id="conteudo" class="conteudo" tabindex="-1" aria-busy="true"><div class="carregando" role="status" aria-label="Carregando tarefas"><span class="esqueleto"></span><span class="esqueleto"></span><span class="esqueleto"></span><span class="sr-only">Carregando tarefas…</span></div></main>
</div>
<aside id="painel" class="painel" role="region" aria-labelledby="painel-titulo" tabindex="-1" hidden></aside>
<div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="anuncio" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
